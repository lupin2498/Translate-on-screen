name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Copy APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/DichManHinh.apk
          ls -la apk
          echo "Thư viện native trong APK:"
          unzip -l apk/DichManHinh.apk | grep "lib/" | awk '{print $1, $4}'
          unzip -l apk/DichManHinh.apk | grep -q "lib/arm64-v8a/libscreenai.so"

      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          unzip -l apk/DichManHinh.apk > apk-contents.txt 2>/dev/null || true
          bash .github/scripts/publish-report.sh build-apk build.log apk-contents.txt app/build/test-results/testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: DichManHinh-apk
          path: apk/DichManHinh.apk

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/DichManHinh.apk
          git commit -m "Cập nhật bộ cài APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

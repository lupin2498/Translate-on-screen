name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Copy APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/DichManHinh.apk
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: DichManHinh-apk
          path: apk/DichManHinh.apk

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/DichManHinh.apk
          git commit -m "Cập nhật bộ cài APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
